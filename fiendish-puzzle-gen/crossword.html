<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Generator — Fiendish Puzzle Gen</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/crossword.css">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="app-container">
        <nav class="no-print">
            <a href="index.html" class="nav-back">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Tools
            </a>
        </nav>

        <header class="site-header no-print" style="padding-top:0">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.8"/>
                        <rect x="17" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.4"/>
                        <rect x="3" y="17" width="8" height="8" rx="1.5" fill="white" opacity="0.4"/>
                        <rect x="17" y="17" width="8" height="8" rx="1.5" fill="white" opacity="0.8"/>
                        <rect x="12" y="3" width="4" height="22" rx="1" fill="white" opacity="0.3"/>
                        <rect x="3" y="12" width="22" height="4" rx="1" fill="white" opacity="0.3"/>
                    </svg>
                </div>
                <h1 class="site-title" style="font-size:clamp(1.5rem,4vw,2.2rem)">Crossword Generator</h1>
            </div>
            <p class="site-subtitle">Auto-generate interlocking crossword grids from your clues</p>
        </header>

        <main class="cw-layout">
            <section class="controls-panel no-print fade-in">

                <div class="input-area">
                    <label class="form-label">Add Clue / Answer Pair</label>
                    <div class="clue-input-group">
                        <input type="text" id="answer-input" class="form-input" placeholder="Answer (the word)" autocomplete="off" maxlength="20">
                        <input type="text" id="clue-input" class="form-input" placeholder="Clue (the hint)" autocomplete="off" maxlength="120">
                        <button id="add-clue-btn" class="btn-add" title="Add clue">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Answer: letters only · Clue: any text · Min 3 clues to generate</p>
                </div>

                <div id="clue-list" class="clue-list"></div>

                <div class="options-row">
                    <div class="option-group">
                        <label for="puzzle-title" class="form-label">Puzzle Title</label>
                        <input type="text" id="puzzle-title" class="form-input" placeholder="My Crossword" maxlength="50">
                    </div>
                </div>

                <div class="toggle-row">
                    <label class="toggle-switch" for="cipher-clues">
                        <input type="checkbox" id="cipher-clues">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        <span class="toggle-label">
                            <span class="toggle-title">Cipher the Clues</span>
                            <span class="toggle-desc">Apply ROT13 to all clues for extra suffering</span>
                        </span>
                    </label>
                </div>

                <div class="toggle-row">
                    <label class="toggle-switch" for="show-answer-key">
                        <input type="checkbox" id="show-answer-key" checked>
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        <span class="toggle-label">
                            <span class="toggle-title">Include Answer Key</span>
                            <span class="toggle-desc">Filled grid prints on a separate page</span>
                        </span>
                    </label>
                </div>

                <div class="action-buttons">
                    <button id="generate-btn" class="btn btn-primary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 1.5L11 6.5L16.5 7.5L12.5 11.5L13.5 17L9 14.5L4.5 17L5.5 11.5L1.5 7.5L7 6.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        Generate Crossword
                    </button>
                    <button id="print-btn" class="btn btn-secondary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M4.5 6V2h9v4M4.5 13.5H3a1.5 1.5 0 01-1.5-1.5V9A1.5 1.5 0 013 7.5h12A1.5 1.5 0 0116.5 9v3a1.5 1.5 0 01-1.5 1.5h-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4.5" y="10.5" width="9" height="5.5" rx="0.5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        Print
                    </button>
                    <button id="clear-btn" class="btn btn-ghost">Clear All</button>
                </div>

                <div id="gen-warning" class="gen-warning" style="display:none"></div>
            </section>

            <section class="puzzle-output" id="puzzle-output" style="display:none">
                <div class="print-header print-only">
                    <h2 id="print-title" class="print-title">Crossword</h2>
                </div>

                <div class="cw-grid-wrap">
                    <div id="cw-grid" class="cw-grid"></div>
                </div>

                <div class="cw-clues-wrap">
                    <div class="cw-clues-col">
                        <h3 class="clues-heading">Across</h3>
                        <ol id="clues-across" class="clues-list"></ol>
                    </div>
                    <div class="cw-clues-col">
                        <h3 class="clues-heading">Down</h3>
                        <ol id="clues-down" class="clues-list"></ol>
                    </div>
                </div>

                <div id="answer-key-section" style="display:none" class="answer-key-section">
                    <div class="print-header print-only">
                        <h2 class="print-title">Answer Key</h2>
                    </div>
                    <div class="grid-section-label">
                        <span class="label-dot label-dot--answer"></span>
                        Filled Grid
                    </div>
                    <div id="cw-answer-grid" class="cw-grid cw-grid--answer"></div>
                </div>
            </section>
        </main>

        <footer class="site-footer no-print">
            <span class="phase-label">Fiendish Puzzle Gen · Phase 3</span>
        </footer>
    </div>
    <script src="js/crossword.js"></script>
</body>
</html>
