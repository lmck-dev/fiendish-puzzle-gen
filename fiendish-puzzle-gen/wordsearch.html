<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search — Fiendish Puzzle Gen</title>
    <meta name="description" content="Generate devious printable word search puzzles with custom word lists, hex mode, and answer key generation.">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/wordsearch.css">
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="app-container">
        <!-- Back Nav -->
        <nav class="no-print">
            <a href="index.html" class="nav-back" id="nav-back">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Tools
            </a>
        </nav>

        <!-- Header -->
        <header class="site-header no-print" style="padding-top: 0;">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
                        <rect x="12" y="3" width="7" height="7" rx="1.5" fill="white" opacity="0.5"/>
                        <rect x="3" y="12" width="7" height="7" rx="1.5" fill="white" opacity="0.5"/>
                        <rect x="12" y="12" width="7" height="7" rx="1.5" fill="white" opacity="0.3"/>
                        <rect x="21" y="3" width="4" height="4" rx="1" fill="white" opacity="0.3"/>
                        <rect x="3" y="21" width="4" height="4" rx="1" fill="white" opacity="0.3"/>
                    </svg>
                </div>
                <h1 class="site-title" style="font-size: clamp(1.5rem, 4vw, 2.2rem);">Word Search</h1>
            </div>
            <p class="site-subtitle">Enter words to create a fiendish printable puzzle</p>
        </header>

        <!-- Main Content -->
        <main class="ws-layout">
            <!-- Controls Panel -->
            <section class="controls-panel no-print fade-in" id="controls-panel">
                <!-- Input Area -->
                <div class="input-area">
                    <label for="word-input" class="form-label">Add Words</label>
                    <div class="input-row">
                        <input
                            type="text"
                            id="word-input"
                            class="form-input"
                            placeholder="Type a word and press Enter…"
                            autocomplete="off"
                            maxlength="20"
                        >
                        <button id="add-word-btn" class="btn-add" title="Add word">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Letters and numbers only · Max 20 characters per word</p>
                </div>

                <!-- Word Tags -->
                <div class="word-tags" id="word-tags">
                    <!-- Tags inserted here -->
                </div>

                <!-- Hex Mode Toggle -->
                <div class="toggle-row" id="hex-toggle-row">
                    <label class="toggle-switch" for="hex-mode">
                        <input type="checkbox" id="hex-mode">
                        <span class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </span>
                        <span class="toggle-label">
                            <span class="toggle-title">Hex Mode</span>
                            <span class="toggle-desc">Restrict to <code>0-9 A-F</code> only — filler uses hex characters</span>
                        </span>
                    </label>
                </div>

                <!-- Options Row -->
                <div class="options-row">
                    <div class="option-group">
                        <label for="grid-size" class="form-label">Grid Size</label>
                        <select id="grid-size" class="form-select">
                            <option value="10">10 × 10</option>
                            <option value="12" selected>12 × 12</option>
                            <option value="14">14 × 14</option>
                            <option value="16">16 × 16</option>
                            <option value="18">18 × 18</option>
                            <option value="20">20 × 20</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="direction-mode" class="form-label">Directions</label>
                        <select id="direction-mode" class="form-select">
                            <option value="easy">Easy (→ ↓)</option>
                            <option value="medium" selected>Medium (→ ↓ ↘)</option>
                            <option value="hard">Hard (all 8)</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="puzzle-title" class="form-label">Puzzle Title</label>
                        <input type="text" id="puzzle-title" class="form-input" placeholder="My Fiendish Puzzle" maxlength="50">
                    </div>
                </div>

                <!-- Answer Key Toggle -->
                <div class="toggle-row" id="answer-toggle-row">
                    <label class="toggle-switch" for="show-answer-key">
                        <input type="checkbox" id="show-answer-key" checked>
                        <span class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </span>
                        <span class="toggle-label">
                            <span class="toggle-title">Generate Answer Key</span>
                            <span class="toggle-desc">Include a highlighted solution grid — prints on a separate page</span>
                        </span>
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="generate-btn" class="btn btn-primary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 1.5L11 6.5L16.5 7.5L12.5 11.5L13.5 17L9 14.5L4.5 17L5.5 11.5L1.5 7.5L7 6.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        Generate Puzzle
                    </button>
                    <button id="print-btn" class="btn btn-secondary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M4.5 6V2h9v4M4.5 13.5H3a1.5 1.5 0 01-1.5-1.5V9A1.5 1.5 0 013 7.5h12A1.5 1.5 0 0116.5 9v3a1.5 1.5 0 01-1.5 1.5h-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4.5" y="10.5" width="9" height="5.5" rx="0.5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        Print
                    </button>
                    <button id="clear-btn" class="btn btn-ghost">Clear All</button>
                </div>
            </section>

            <!-- Puzzle Output -->
            <section class="puzzle-output" id="puzzle-output" style="display:none;">
                <!-- Print Header (puzzle page) -->
                <div class="print-header print-only">
                    <h2 id="print-title" class="print-title">Word Search</h2>
                </div>

                <!-- Puzzle Grid -->
                <div class="grid-container">
                    <div class="grid-section-label no-print">
                        <span class="label-dot label-dot--puzzle"></span>
                        Puzzle Grid
                    </div>
                    <table class="puzzle-grid" id="puzzle-grid">
                        <!-- Generated grid -->
                    </table>
                </div>

                <!-- Word Bank -->
                <div class="word-bank">
                    <h3 class="word-bank-title">Find these words:</h3>
                    <ul class="word-bank-list" id="word-bank-list">
                        <!-- Word list here -->
                    </ul>
                </div>

                <!-- Answer Key Section -->
                <div class="answer-key-section" id="answer-key-section" style="display:none;">
                    <div class="print-header print-only">
                        <h2 class="print-title">Answer Key</h2>
                    </div>
                    <div class="grid-container">
                        <div class="grid-section-label">
                            <span class="label-dot label-dot--answer"></span>
                            Answer Key
                        </div>
                        <table class="puzzle-grid" id="answer-grid">
                            <!-- Answer key grid -->
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="site-footer no-print">
            <span class="phase-label">🔥 Fiendish Puzzle Gen</span>
        </footer>
    </div>

    <script src="js/wordsearch.js"></script>
</body>
</html>
