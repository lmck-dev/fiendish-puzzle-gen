<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Chainer — Fiendish Puzzle Gen</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/chainer.css">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="app-container">
        <nav class="no-print">
            <a href="index.html" class="nav-back">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Tools
            </a>
        </nav>

        <header class="site-header no-print" style="padding-top:0">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="7" cy="7" r="4" stroke="white" stroke-width="1.5" opacity="0.9"/>
                        <circle cx="21" cy="7" r="4" stroke="white" stroke-width="1.5" opacity="0.6"/>
                        <circle cx="7" cy="21" r="4" stroke="white" stroke-width="1.5" opacity="0.6"/>
                        <circle cx="21" cy="21" r="4" stroke="white" stroke-width="1.5" opacity="0.9"/>
                        <path d="M11 7h6M7 11v6M21 11v6M11 21h6" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                </div>
                <h1 class="site-title" style="font-size:clamp(1.5rem,4vw,2.2rem)">Puzzle Chainer</h1>
            </div>
            <p class="site-subtitle">Stack ciphers and scrambles — the output of each feeds the next</p>
        </header>

        <main class="ch-layout">
            <!-- Controls -->
            <section class="controls-panel no-print fade-in">

                <div class="input-area">
                    <label class="form-label">Puzzle Title</label>
                    <input type="text" id="chain-title" class="form-input" placeholder="My Fiendish Chain" maxlength="60">
                </div>

                <div class="input-area">
                    <label class="form-label">Original Message</label>
                    <textarea id="chain-input" class="form-textarea" placeholder="Enter the plaintext the solver must ultimately discover…" rows="3" maxlength="200"></textarea>
                    <p class="input-hint">This is the secret. The solver never sees it — they work backwards from your encoded chain.</p>
                </div>

                <div class="step-builder">
                    <div class="step-builder-label">
                        <span>Encoding Steps</span>
                        <span class="step-count-badge" id="step-count">0 steps</span>
                    </div>
                    <div id="step-list" class="step-list"></div>
                    <button id="add-step-btn" class="btn-add-step">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Add Step
                    </button>
                </div>

                <div class="action-buttons">
                    <button id="generate-btn" class="btn btn-primary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 1.5L11 6.5L16.5 7.5L12.5 11.5L13.5 17L9 14.5L4.5 17L5.5 11.5L1.5 7.5L7 6.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        Generate Chain
                    </button>
                    <button id="print-btn" class="btn btn-secondary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M4.5 6V2h9v4M4.5 13.5H3a1.5 1.5 0 01-1.5-1.5V9A1.5 1.5 0 013 7.5h12A1.5 1.5 0 0116.5 9v3a1.5 1.5 0 01-1.5 1.5h-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4.5" y="10.5" width="9" height="5.5" rx="0.5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        Print
                    </button>
                    <button id="export-btn" class="btn btn-secondary" disabled>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 3v8M6 8l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3 13v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Export for Code Talker
                    </button>
                    <button id="clear-btn" class="btn btn-ghost">Clear All</button>
                </div>

            </section>

            <!-- Output -->
            <section class="chain-output-section" id="chain-output" style="display:none">

                <!-- On-screen chain visualisation -->
                <div class="chain-preview no-print" id="chain-preview"></div>

                <!-- Print-only content (solver worksheet + answer key) -->
                <div id="print-output"></div>

            </section>
        </main>

        <footer class="site-footer no-print">
            <span class="phase-label">Fiendish Puzzle Gen · Phase 4</span>
        </footer>
    </div>
    <script src="js/chainer.js"></script>
</body>
</html>
